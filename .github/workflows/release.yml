# Release of DiskFlux: builds the packages and publishes them when a tag like
# v1.0.0 is pushed (MAJOR.MINOR.PATCH, three numbers; the tags of SnapRAID Daemon
# have two, like v2.2). The version of SnapRAID Daemon it is based on is in
# configure.ac (upstream_version) and goes in the notes.
name: Release

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: write

jobs:
  release:
    # The oldest runner, so that the program runs on older systems too
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Fetch the tags as they are, annotated
      run: git fetch --tags --force
    - name: Take the notes of this version from RELEASE-NOTES.md
      # before anything is built: a release without its notes is refused
      run: |
        version="${GITHUB_REF_NAME#v}"
        awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on' RELEASE-NOTES.md > whats-new.md
        if ! grep -q '[^[:space:]]' whats-new.md; then
          echo "::error::RELEASE-NOTES.md has no section '## $version': write what this release adds there, in the commit that is tagged"
          exit 1
        fi
    - name: Install the build tools
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q autoconf automake zip zlib1g-dev libzstd-dev rpm
    - name: Build the source package
      run: |
        autoreconf -i
        ./configure
        make dist
    - name: Check that the tag is a version of DiskFlux and the version is the tag
      run: |
        echo "$GITHUB_REF_NAME" | grep -Eqx 'v[1-9][0-9]{0,2}\.[0-9]{1,3}\.[0-9]{1,3}'
        test -f "diskflux-${GITHUB_REF_NAME#v}.tar.gz"
        echo "UPSTREAM=$(sed -n 's/^m4_define(\[upstream_version\], \[\(.*\)\])$/\1/p' configure.ac)" >> "$GITHUB_ENV"
    - name: Build the .deb package
      run: bash makedeb.sh
    - name: Build the package that moves the earlier releases to DiskFlux
      run: bash maketransition.sh
    - name: Build the .rpm package
      run: bash makerpm.sh
    - name: Checksums
      run: sha256sum diskflux*.tar.gz diskflux*.deb snapraid-daemon-storage*.deb diskflux*.x86_64.rpm > SHA256SUMS
    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        {
          echo "DiskFlux, the storage manager for SnapRAID: an unofficial extension of SnapRAID Daemon by Andrea Mazzoleni. Based on SnapRAID Daemon ${UPSTREAM}."
          echo
          echo "## What's new"
          echo
          sed -e '/./,$!d' whats-new.md | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}'
          echo
          echo "## Install or update"
          echo
          echo "    curl -fsSL https://raw.githubusercontent.com/paleka/diskflux/storage/installer.sh | sudo sh"
          echo
          echo 'Already on DiskFlux: System › Updates, or `sudo diskflux-upgrade`.'
          echo
          echo "Details in the README; everything the fork adds in CHANGES-FORK."
        } > notes.md
        gh release create "$GITHUB_REF_NAME" \
          --title "DiskFlux ${GITHUB_REF_NAME#v}" \
          --notes-file notes.md \
          diskflux*.tar.gz diskflux*.deb snapraid-daemon-storage*.deb diskflux*.x86_64.rpm SHA256SUMS
